<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cocula, Cuna del Mariachi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/hub.css">
</head>
<body data-page="punto">
<!-- QUÉ NO HAY QUE BORRAR: los elementos con id (fondoEfecto, siteHeader, logoLink, logo, logoText, menuBtn, menuBtnLabel, mainNav, navHub, navPriv, langSel, content, privLink) y los tres scripts del final -->
<div id="fondoEfecto" class="fondo-efecto" aria-hidden="true"></div>
<header id="siteHeader" class="cabecera">
  <div class="cabecera-in">
    <select id="langSel" aria-label="Language"></select>
    <a id="logoLink" class="logo-link" href="/hub"><img id="logo" alt="" hidden><span id="logoText"></span></a>
    <button id="menuBtn" class="menu-btn" type="button" aria-expanded="false" aria-controls="mainNav"><span class="rayas" aria-hidden="true"></span><span id="menuBtnLabel" class="sr">Menu</span></button>
    <nav id="mainNav" class="nav"><a id="navHub" href="/hub"></a><a id="navPriv" href="/privacidad"></a></nav>
  </div>
</header>
<main id="content"></main>
<footer id="siteFooter" class="pie">
  <div class="pie-in">
    <div class="pie-brand">
      <img id="footerLogo" alt="" hidden>
      <span id="footerLogoText"></span>
    </div>
    <nav id="footerNav" class="pie-nav">
      <a id="fNavHub" href="/hub"></a>
      <a id="privLink" href="/privacidad"></a>
    </nav>
  </div>
</footer>
<script src="/track.js"></script>
<script src="/fx.js"></script>
<script src="/site.js"></script>
</body>
</html>
