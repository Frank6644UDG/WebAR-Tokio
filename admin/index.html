<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de experiencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#1b1e26;display:flex;min-height:100vh}
  aside{width:240px;background:#1b1e26;color:#fff;padding:16px;flex-shrink:0}
  aside h2{margin:0 0 12px;font-size:1rem}
  aside button{width:100%;text-align:left;margin-bottom:6px;padding:10px;border:0;border-radius:8px;background:#2a2f3b;color:#fff;cursor:pointer}
  aside button.on{background:#ff4d6d}
  main{flex:1;padding:24px;min-width:0}
  fieldset{border:1px solid #d8dbe2;border-radius:12px;background:#fff;margin:0 0 16px;padding:16px}
  legend{font-weight:700;padding:0 6px}
  label{display:block;margin:10px 0 4px;font-size:.85rem;font-weight:600}
  input[type=text],input[type=number],textarea,select{width:100%;padding:9px;border:1px solid #c9ced8;border-radius:8px;font:inherit}
  textarea{min-height:110px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .el{border:1px solid #d8dbe2;border-left:5px solid #ff4d6d;border-radius:10px;padding:12px;margin:12px 0;background:#fafbfc}
  .elh{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .elh select{width:auto}
  .elh button,.tabs button,.add button,#pvChips button{padding:6px 12px;border:1px solid #c9ced8;background:#fff;border-radius:8px;cursor:pointer;margin-left:4px}
  .tabs button.on,#pvChips button.on{background:#1b1e26;color:#fff}
  .add{margin-top:8px}.add button{margin:0 6px 0 0}
  .primary{background:#ff4d6d;color:#fff;border:0;padding:12px 22px;border-radius:10px;font-weight:700;cursor:pointer}
  .danger{background:#fff;color:#c0243f;border:1px solid #c0243f;padding:12px 18px;border-radius:10px;cursor:pointer;margin-left:8px}
  small{color:#6b7280;display:block;margin-top:4px;word-break:break-all}
  #status{margin-left:12px;font-weight:600}
  a{color:#ff4d6d}
  .qrbox{background:#fff;border:1px dashed #c9ced8;border-radius:10px;padding:14px;margin-top:12px;text-align:center}
  .qrbox svg{width:100%;max-width:280px;height:auto}
  /* Vista previa en teléfono (ajustable a promedios Android / iPhone) */
  #phoneCol{width:300px;padding:24px 12px;position:sticky;top:0;align-self:flex-start;flex-shrink:0}
  #phoneCol h3{margin:0 0 8px;text-align:center}
  #pvChips,#pvDevice{text-align:center;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  #pvDevice button{padding:4px 8px;font-size:.75rem;border:1px solid #c9ced8;background:#fff;border-radius:6px;cursor:pointer}
  #pvDevice button.on{background:#1b1e26;color:#fff;border-color:#1b1e26}
  .phoneWrap{padding:10px;background:#111;border-radius:36px;width:254px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .phone{width:234px;height:513px;overflow:hidden;border-radius:26px;position:relative;background:#333;transition:height .18s ease}
  .pvscreen{width:375px;height:822px;transform:scale(.624);transform-origin:0 0;position:relative;color:#fff;
    font-family:"Noto Sans","Noto Sans JP","Noto Sans SC","Noto Sans KR",system-ui,-apple-system,sans-serif;background:linear-gradient(#4a4f5c,#2b2e37)}
  .pvimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
  .pvimg-drag{position:absolute;left:50%;top:50%;width:100%;max-height:100%;transform:translate(-50%,-50%);cursor:grab;user-select:none;touch-action:none;z-index:2;transition:outline-color .15s}
  .pvimg-drag img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;pointer-events:none}
  .pvimg-drag:hover{outline:2px dashed rgba(255,255,255,.65);outline-offset:2px}
  .pvimg-drag.dragging{cursor:grabbing;outline:2px solid #38bdf8;outline-offset:2px}
  .pvimg-drag:hover .pvdraghint,.pvimg-drag.dragging .pvdraghint{opacity:1}
  .pvlabel{position:absolute;top:50%;left:0;right:0;text-align:center;opacity:.7;pointer-events:none}
  .pvpanel{position:absolute;left:50%;top:96%;width:93%;max-width:calc(100% - 16px);transform:translate(-50%,-96%);background:rgba(0,0,0,.8);border-radius:18px;padding:16px;z-index:6;
    cursor:grab;user-select:none;touch-action:none;transition:outline-color .15s}
  .pvpanel:hover{outline:2px dashed rgba(255,255,255,.6);outline-offset:2px}
  .pvpanel.dragging{cursor:grabbing;outline:2px solid #ff4d6d;outline-offset:2px}
  .pvdraghint{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#ff4d6d;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
  .pvpanel:hover .pvdraghint,.pvpanel.dragging .pvdraghint{opacity:1}
  .pvpanel h2{margin:0 0 8px;font-size:1.1rem}
  .pvbody{max-height:187px;overflow:hidden;line-height:1.5;white-space:pre-line;font-size:16px}
  .pvrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .pvb{padding:10px 16px;border-radius:14px;background:var(--pv-cta-bg,#ff4d6d);font-size:14.4px;font-weight:600;color:var(--pv-cta-fg,#fff)}
  .pvb.g{background:var(--pv-sec-bg,#2a2f3b);color:var(--pv-sec-fg,#fff);border:1.5px solid rgba(255,255,255,.35)}
  .pvfloat{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;pointer-events:none}
  .pvsound{position:absolute;top:12px;left:12px;background:#000a;border:1.5px solid #fff6;pointer-events:none}
  .pvaim{position:absolute;left:0;right:0;top:62%;text-align:center;pointer-events:none}
  .pvaim span{background:#000a;padding:8px 14px;border-radius:999px}
  .stylebox{margin-top:10px;padding:10px 12px;border:1px solid #dfe3eb;border-radius:8px;background:#f7f8fa}
  .stylebox summary{cursor:pointer;font-weight:700;font-size:.85rem;color:#1b1e26;list-style:none}
  .stylebox summary::-webkit-details-marker{display:none}
  .stylegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .stylegrid label{margin:0 0 3px;font-size:.78rem}
  .stylegrid input[type=color]{width:42px;flex-shrink:0;height:34px;padding:2px;border:1px solid #c9ced8;border-radius:6px;background:#fff;cursor:pointer}
  .color-hex{display:flex;align-items:center;gap:6px}
  .color-hex input[type=color]{width:42px;min-width:42px;height:36px;padding:2px;border:1px solid #c9ced8;border-radius:6px;background:#fff;cursor:pointer;flex-shrink:0}
  .color-hex .hex-in{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:.84rem;padding:7px 8px;text-transform:uppercase}
  .stylegrid input[type=range]{width:100%;accent-color:#ff4d6d}
  .stylegrid input[type=number],.stylegrid select{padding:6px 8px;font-size:.82rem}
  .posrow{display:flex;align-items:flex-end;gap:8px;margin-top:8px;flex-wrap:wrap}
  .posrow > div{flex:1;min-width:80px}
  .posrow button{padding:7px 10px;font-size:.78rem;border:1px solid #c9ced8;background:#fff;border-radius:6px;cursor:pointer;white-space:nowrap}
  .tl-wrap{margin-top:14px;padding:12px 14px;border:1px solid #dfe3eb;border-radius:10px;background:#fafbfc}
  .tl-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.86rem}
  .tl-row{margin-bottom:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #e5e7eb}
  .tl-row:last-child{margin-bottom:0}
  .tl-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;margin-bottom:6px;flex-wrap:wrap}
  .tl-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:700;color:#fff}
  .tl-badge.video{background:#7c3aed}.tl-badge.image{background:#0284c7}.tl-badge.text{background:#ff4d6d}
  .tl-track{position:relative;height:20px;background:#eef0f4;border-radius:6px;overflow:hidden}
  .tl-bar{position:absolute;top:0;bottom:0;border-radius:6px;font-size:.72rem;font-weight:600;color:#fff;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-bar.video{background:#8b5cf6}.tl-bar.image{background:#0ea5e9}.tl-bar.text{background:#fb7185}.tl-bar.layer{background:#10b981}
  .tl-layers{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .tl-lrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:.75rem;color:#4b5563}
  .tl-ticks{display:flex;justify-content:space-between;font-size:.7rem;color:#9ca3af;margin-top:3px}
  .layers{margin-top:12px;padding-top:8px;border-top:1px dashed #c9ced8}
  .layer{border:1px solid #e1e4ea;border-left:4px solid #6c8cff;border-radius:8px;padding:10px;margin:10px 0;background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  fieldset.sub{background:#fafbfc;margin:12px 0}
  @media(max-width:900px){body{flex-direction:column}aside{width:100%}#phoneCol{position:static;width:100%}}
</style>
</head>
<body>
<aside>
  <h2>Experiencias</h2>
  <div id="list"></div>
  <button id="btnNew">＋ Nueva experiencia</button>
</aside>
<main id="main"></main>
<div id="phoneCol">
  <h3>Vista previa</h3>
  <div id="pvDevice"></div>
  <div id="pvChips"></div>
  <div id="pvTime" style="text-align:center;margin-bottom:8px"></div>
  <div class="phoneWrap"><div class="phone" id="pvPhone"><div class="pvscreen" id="pvScreen"></div></div></div>
  <small id="pvDim" style="text-align:center"></small>
  <small style="text-align:center">Arrastra la caja de texto con el mouse para moverla. Toca un elemento para verlo.</small>
</div>

<script src="/admin/extra.js"></script>
<script>
const LANGS = { es:'Español', en:'English', ja:'日本語', zh:'中文', ko:'한국어' };
const TYPES = { video:'Video', image:'Imagen / animación WebP', text:'Texto (paso aparte)' };
const PV = {
  es:{more:'Leer más',next:'Siguiente',close:'Cerrar',aim:'Enfoca la silueta',mute:'Silenciar'},
  en:{more:'Read more',next:'Next',close:'Close',aim:'Aim at the outline',mute:'Mute'},
  ja:{more:'続きを読む',next:'次へ',close:'閉じる',aim:'シルエットに合わせてください',mute:'ミュート'},
  zh:{more:'阅读更多',next:'下一步',close:'关闭',aim:'请对准轮廓',mute:'静音'},
  ko:{more:'더 보기',next:'다음',close:'닫기',aim:'실루엣에 맞춰 주세요',mute:'음소거'}
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const PHONES = {
  avg:     { label: 'Promedio', w: 375, h: 822 },
  android: { label: 'Android',  w: 360, h: 800 },
  iphone:  { label: 'iPhone',   w: 390, h: 844 }
};
const DEFAULT_STYLE = { textColor:'#ffffff', bgColor:'#000000', bgOpacity:80, borderRadius:18, fontSize:16, textAlign:'left', width:93, x:50, y:96 };
const DEFAULT_MEDIA_STYLE = { width:100, x:50, y:50 };
const normStyle = (s) => Object.assign({}, DEFAULT_STYLE, s || {});
const normMediaStyle = (s) => Object.assign({}, DEFAULT_MEDIA_STYLE, s || {});
function hexToRgba(hex, op) {
  const m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '#000000');
  const r = m ? parseInt(m[1], 16) : 0, g = m ? parseInt(m[2], 16) : 0, b = m ? parseInt(m[3], 16) : 0;
  const a = Math.min(100, Math.max(0, Number.isFinite(Number(op)) ? Number(op) : 80)) / 100;
  return `rgba(${r},${g},${b},${a.toFixed(2)})`;
}
let all = [], cur = null, tab = 'es', pv = 0, pvDev = 'avg', qrLast = null, view = 'exp';

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function applyPreviewTheme() {
  try {
    const s = (typeof siteData !== 'undefined' && siteData) || (await api('/api/site')).settings;
    if (!s) return;
    document.documentElement.style.setProperty('--pv-cta-bg', s.arCtaBg || s.ctaBg || s.accent || '#ff4d6d');
    document.documentElement.style.setProperty('--pv-cta-fg', s.arCtaColor || s.ctaColor || '#ffffff');
    document.documentElement.style.setProperty('--pv-sec-bg', s.arSecBg || '#2a2f3b');
    document.documentElement.style.setProperty('--pv-sec-fg', s.arSecColor || '#ffffff');
    const ff = s.fontFamily || 'Noto Sans';
    if (ff !== 'Noto Sans') {
      const id = 'gf-pv-' + ff.replace(/\s+/g, '-');
      if (!document.getElementById(id)) {
        const lk = document.createElement('link');
        lk.id = id; lk.rel = 'stylesheet';
        lk.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(ff) + ':ital,wght@0,400;0,600;0,700;1,400&display=swap';
        document.head.appendChild(lk);
      }
    }
    const sc = $('#pvScreen');
    if (sc) sc.style.fontFamily = `"${ff}", "Noto Sans JP", "Noto Sans SC", "Noto Sans KR", system-ui, sans-serif`;
  } catch (e) {}
}
function enhanceColorPickers(root) {
  (root || document).querySelectorAll('input[type="color"]').forEach(cp => {
    if (cp.dataset.hexBound) return;
    cp.dataset.hexBound = '1';
    const wrap = document.createElement('div');
    wrap.className = 'color-hex';
    const hex = document.createElement('input');
    hex.type = 'text';
    hex.className = 'hex-in';
    hex.maxLength = 7;
    hex.placeholder = '#000000';
    hex.value = (cp.value || '#000000').toUpperCase();
    hex.setAttribute('aria-label', 'Código hexadecimal');
    cp.parentNode.insertBefore(wrap, cp);
    wrap.appendChild(cp);
    wrap.appendChild(hex);
    cp.addEventListener('input', () => { hex.value = cp.value.toUpperCase(); });
    cp.addEventListener('change', () => { hex.value = cp.value.toUpperCase(); });
    hex.addEventListener('input', () => {
      let v = hex.value.trim();
      if (v && !v.startsWith('#')) v = '#' + v;
      if (/^#[0-9a-f]{6}$/i.test(v)) {
        cp.value = v.toLowerCase();
        cp.dispatchEvent(new Event('input', { bubbles: true }));
        cp.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });
    hex.addEventListener('blur', () => { hex.value = cp.value.toUpperCase(); });
  });
}
async function refresh(selectId) {
  all = await api('/api/experiences');
  cur = all.find(e => e.id === selectId) || (cur && all.find(e => e.id === cur.id)) || all[0] || null;
  applyPreviewTheme();
  render();
}
const blank = () => ({ name:'Nueva experiencia', targetSrc:'', silhouetteSrc:'', elements:[], page: emptyPage() });
const status = (m) => { if ($('#status')) $('#status').textContent = m; };

function fileField(k, label, accept) {
  return `<label>${label}</label><input type="file" data-k="${k}" accept="${accept}"><small>${esc(cur[k]) || 'Sin archivo'}</small>`;
}
function styleHtml(style, key) {
  const s = normStyle(style);
  return `<details class="stylebox" open>
    <summary>🎨 Estilo y posición de la caja de texto</summary>
    <div class="stylegrid">
      <div><label>Color tipografía</label><input type="color" data-sk="${key}" data-sp="textColor" value="${esc(s.textColor)}"></div>
      <div><label>Color de caja</label><input type="color" data-sk="${key}" data-sp="bgColor" value="${esc(s.bgColor)}"></div>
      <div><label>Opacidad caja: <b data-sv="${key}.bgOpacity">${s.bgOpacity}%</b></label><input type="range" min="0" max="100" step="5" data-sk="${key}" data-sp="bgOpacity" value="${s.bgOpacity}"></div>
      <div><label>Esquinas: <b data-sv="${key}.borderRadius">${s.borderRadius}px</b></label><input type="range" min="0" max="48" step="1" data-sk="${key}" data-sp="borderRadius" value="${s.borderRadius}"></div>
      <div><label>Tamaño texto: <b data-sv="${key}.fontSize">${s.fontSize}px</b></label><input type="range" min="12" max="32" step="1" data-sk="${key}" data-sp="fontSize" value="${s.fontSize}"></div>
      <div><label>Ancho caja: <b data-sv="${key}.width">${s.width}%</b></label><input type="range" min="45" max="96" step="1" data-sk="${key}" data-sp="width" value="${s.width}"></div>
    </div>
    <div class="posrow">
      <div><label>Alineación</label><select data-sk="${key}" data-sp="textAlign">
        <option value="left" ${s.textAlign==='left'?'selected':''}>Izquierda</option>
        <option value="center" ${s.textAlign==='center'?'selected':''}>Centro</option>
        <option value="right" ${s.textAlign==='right'?'selected':''}>Derecha</option>
      </select></div>
      <div><label>Posición X (%)</label><input type="number" min="0" max="100" data-sk="${key}" data-sp="x" value="${s.x}"></div>
      <div><label>Posición Y (%)</label><input type="number" min="0" max="100" data-sk="${key}" data-sp="y" value="${s.y}"></div>
      <button type="button" data-sreset="${key}">↺ Centrar abajo</button>
    </div>
    <small>Tip: también puedes arrastrar la caja con el mouse directamente en la vista previa del teléfono.</small>
  </details>`;
}
function mediaStyleHtml(ms, i) {
  const s = normMediaStyle(ms);
  return `<details class="stylebox" open>
    <summary>🖼️ Tamaño y posición de la imagen</summary>
    <div class="posrow">
      <div style="flex:2;min-width:130px"><label>Tamaño / Ancho: <b data-mv="${i}.width">${s.width}%</b></label><input type="range" min="15" max="130" step="1" data-mk="${i}" data-mp="width" value="${s.width}" style="width:100%;accent-color:#ff4d6d"></div>
      <div><label>Posición X (%)</label><input type="number" min="0" max="100" data-mk="${i}" data-mp="x" value="${s.x}"></div>
      <div><label>Posición Y (%)</label><input type="number" min="0" max="100" data-mk="${i}" data-mp="y" value="${s.y}"></div>
      <button type="button" data-mreset="${i}">↺ Centrar</button>
    </div>
    <small>Tip: arrastra la imagen libremente con el mouse en cualquier dirección dentro del teléfono.</small>
  </details>`;
}
function elHtml(el, i) {
  const tx = (el.texts && el.texts[tab]) || { title:'', body:'' };
  const fi = (f, acc) => `<input type="file" data-el="${i}" data-f="${f}" accept="${acc}"><small>${esc(el[f]) || 'Sin archivo'}</small>`;
  const body = el.type === 'text'
    ? `<label>Título (${LANGS[tab]})</label><input type="text" data-ti="${i}" value="${esc(tx.title)}">
       <label>Texto (${LANGS[tab]})</label><textarea data-tb="${i}">${esc(tx.body)}</textarea>
       ${styleHtml(el.style, String(i))}`
    : el.type === 'video'
      ? `<label>Video principal (.mov con transparencia para iPhone, o .mp4)</label>${fi('src','.mov,video/quicktime,video/mp4,video/webm')}
         <label>Video alternativo (.webm con transparencia para Android y Chrome) - opcional</label>${fi('srcAlt','.webm,video/webm')}`
      : `<label>Imagen o animación (.webp animado, .png, .jpg, .gif)</label>${fi('src','image/*')}
         ${mediaStyleHtml(el.mediaStyle, i)}
         <label>Audio (opcional, .mp3 o .m4a). El visitante podrá silenciarlo.</label>${fi('audioSrc','audio/*,.mp3,.m4a,.ogg')}`;
  const layers = el.type === 'text' ? '' : layersHtml(el, i);
  return `<div class="el"><div class="elh"><b>Elemento ${i+1}</b>
    <select data-type="${i}">${Object.entries(TYPES).map(([k,v]) => `<option value="${k}" ${el.type===k?'selected':''}>${v}</option>`).join('')}</select>
    <span><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-del="${i}">✕</button></span></div>${body}${layers}</div>`;
}
function qrHtml() {
  if (!cur.id) return '<fieldset><legend>Código QR</legend><p>Guarda la experiencia para poder generar su QR.</p></fieldset>';
  return `<fieldset><legend>Código QR (stencil o vinilo)</legend>
    <label>¿Qué enlace lleva el QR?</label>
    <select id="q_target"><option value="piso">Experiencia, origen piso</option><option value="placa">Experiencia, origen placa</option><option value="totem">Hub (tótem)</option></select>
    <label>Tipo de QR</label>
    <select id="q_mode" onchange="qrToggle()"><option value="stencil">Stencil: cuadrado, para pintar con plantilla</option><option value="round">Redondo: para vinilo impreso</option></select>
    <small id="q_help"></small>
    <div class="grid">
      <div><label id="q_size_l">Tamaño del QR (cm)</label><input type="number" id="q_size" value="40" min="5" max="300"></div>
      <div class="q-st"><label>Ancho de puentes (% del módulo)</label><input type="number" id="q_bridge" value="30" min="15" max="50"></div>
      <div><label>Corrección de errores</label><select id="q_ecc"><option value="H">Alta (H) - recomendada</option><option value="Q">Media-alta (Q) - QR más simple</option></select></div>
      <div class="q-rd"><label>Color de los puntos (oscuro)</label><input type="color" id="q_fg" value="#12263a"></div>
      <div class="q-rd"><label>Color del anillo</label><input type="color" id="q_ring" value="#0b6fb3"></div>
      <div class="q-rd"><label><input type="checkbox" id="q_fill" checked> Puntos de relleno decorativos</label><label><input type="checkbox" id="q_showring" checked> Anillo exterior</label></div>
    </div>

function timelineHtml() {
  if (!cur || !cur.elements || !cur.elements.length) return '';
  let acc = 0, hasManual = false;
  const rows = cur.elements.map((el, i) => {
    const ls = el.layers || [];
    const maxLayerEnd = ls.reduce((m, l) => Math.max(m, (l.start || 0) + (l.duration > 0 ? l.duration : 2)), 0);
    let durLabel = '', sec = 0;
    if (el.type === 'text') {
      hasManual = true;
      durLabel = 'Manual (hasta tocar Siguiente / Cerrar)';
    } else if (el.type === 'video') {
      hasManual = true;
      durLabel = maxLayerEnd > 0 ? `Duración del video (capas hasta ${maxLayerEnd}s)` : 'Duración del video';
      sec = Math.max(10, Math.ceil(maxLayerEnd));
    } else {
      const d = Number(el.duration) || 0;
      if (d > 0) {
        const eff = Math.max(d, maxLayerEnd);
        durLabel = `${acc}s → ${acc + eff}s (${eff}s)`;
        sec = eff;
        acc += eff;
      } else {
        hasManual = true;
        durLabel = 'Manual (hasta tocar Siguiente / Cerrar)';
        sec = Math.max(10, Math.ceil(maxLayerEnd));

      const lRows = ls.map((l, j) => {

    }
    return `<div class="tl-row">
      <div class="tl-top">
        <span><span class="tl-badge ${el.type}">Paso ${i + 1} · ${typeName}</span> <small style="display:inline;margin-left:6px">${esc(nameHint)}</small></span>

function bindPanelDrag(sc) {
  const panel = sc.querySelector('.pvpanel[data-drag]');
  if (!panel) return;
  const key = panel.dataset.drag;
  panel.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const owner = getStyleOwner(key);
    if (!owner) return;
    owner.style = normStyle(owner.style);
    panel.classList.add('dragging');
    panel.setPointerCapture(e.pointerId);
    const scRect = sc.getBoundingClientRect();
    const pRect = panel.getBoundingClientRect();
    const offX = e.clientX - pRect.left;
    const offY = e.clientY - pRect.top;
    const onMove = (ev) => {
      const availW = Math.max(1, scRect.width - pRect.width);
      const availH = Math.max(1, scRect.height - pRect.height);
      const nx = Math.min(availW, Math.max(0, ev.clientX - scRect.left - offX));
      const ny = Math.min(availH, Math.max(0, ev.clientY - scRect.top - offY));
      const x = Math.round((nx / availW) * 100);
      const y = Math.round((ny / availH) * 100);
      owner.style.x = x;
      owner.style.y = y;
      panel.style.left = x + '%';
      panel.style.top = y + '%';
      panel.style.transform = `translate(-${x}%, -${y}%)`;
      const ix = document.querySelector(`[data-sk="${key}"][data-sp="x"]`);
      const iy = document.querySelector(`[data-sk="${key}"][data-sp="y"]`);
      if (ix) ix.value = x;
      if (iy) iy.value = y;
    };
    const onUp = () => {
      panel.classList.remove('dragging');
      panel.removeEventListener('pointermove', onMove);
      panel.removeEventListener('pointerup', onUp);
      panel.removeEventListener('pointercancel', onUp);
    };
    panel.addEventListener('pointermove', onMove);
    panel.addEventListener('pointerup', onUp);
    panel.addEventListener('pointercancel', onUp);
  });

      wrap.classList.remove('dragging');
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointercancel', onUp);
    };
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointercancel', onUp);
  });
}
function drawScreen() {
  const sc = $('#pvScreen'); if (!sc || !cur) return;
  const L = PV[tab] || PV.en, els = cur.elements;
  let h = '';
  if (pv < 0) {
    h = (cur.silhouetteSrc ? `<img src="${esc(cur.silhouetteSrc)}" alt="" style="position:absolute;left:15%;top:18%;width:70%;height:42%;object-fit:contain;filter:drop-shadow(0 0 6px #fff)">` : '')
      + `<div class="pvaim"><span>${L.aim}</span></div>`;
  } else {
    const el = els[pv], last = pv === els.length - 1;
    if (el.type === 'text') {
      let j = pv - 1; while (j >= 0 && els[j].type === 'text') j--;
      h = (j >= 0 ? media(els[j]) : '') + panelHtml((el.texts && el.texts[tab]) || {}, el.style, L,
        `<span class="pvb pvmore">${L.more}</span>${last ? '' : `<span class="pvb">${L.next}</span>`}<span class="pvb g">${L.close}</span>`, String(pv));
    } else {
      h = media(el, pv);
      if (el.type === 'image') h += `<span class="pvb pvfloat">${last ? L.close : L.next}</span>` + (el.audioSrc ? `<span class="pvb pvsound">🔇 ${L.mute}</span>` : '');
      const li = activeLayerIdx(el, pvT);
      if (li >= 0) {
        const lay = el.layers[li];
        h += panelHtml((lay.texts && lay.texts[tab]) || {}, lay.style, L, `<span class="pvb pvmore">${L.more}</span>`, `${pv}.${li}`);
      }
    }
  }
  sc.innerHTML = h;
  const b = sc.querySelector('.pvbody'), m = sc.querySelector('.pvmore');
  if (b && m) m.style.display = b.scrollHeight > b.clientHeight + 1 ? '' : 'none';
  bindMediaDrag(sc);
  bindPanelDrag(sc);
}

// ---- QR (stencil o vinilo)
async function genQR() {
  const out = $('#qrOut'); out.textContent = 'Generando…';
  const mode = $('#q_mode').value, round = mode === 'round';
  const size = +$('#q_size').value || (round ? 60 : 40), bridge = (+$('#q_bridge').value || 30) / 100, ecc = $('#q_ecc').value;
  const tg = $('#q_target').value;
  const url = tg === 'totem' ? `${location.origin}/?s=totem` : `${location.origin}/?e=${cur.id}&s=${tg}`;
  const extra = round ? `&fg=${$('#q_fg').value.slice(1)}&ringColor=${$('#q_ring').value.slice(1)}&filler=${$('#q_fill').checked ? 1 : 0}&showRing=${$('#q_showring').checked ? 1 : 0}` : '';
  try {
    const r = await fetch(`/api/qr.svg?url=${encodeURIComponent(url)}&size=${size}&bridge=${bridge}&ecc=${ecc}&mode=${mode}${extra}`);
    if (!r.ok) throw new Error(await r.text());
    const svg = await r.text(), hd = (k) => r.headers.get(k);
    const n = +hd('X-QR-Modules'), cm = +hd('X-QR-Module-Cm'), side = +hd('X-QR-Side-Cm');
    const blobUrl = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml' }));
    const dist = (side / 100 * 10).toFixed(1);
    const info = round
      ? `${n}×${n} módulos · cada módulo mide <b>${cm} cm</b> · el QR interior mide ${side} cm de lado (lectura cómoda hasta unos ${dist} m, guía aproximada)${cm < 0.8 ? ' · ⚠ módulos pequeños: agranda el diámetro' : ''}`
      : `${n}×${n} módulos · cada módulo mide <b>${cm} cm</b> · ${hd('X-QR-Bridges')} puentes de <b>${(cm * bridge * 10).toFixed(1)} mm</b> · ${hd('X-QR-Connected') === 'true' ? '✓ todas las piezas de la plantilla quedan unidas' : '⚠ revisa: hay piezas sueltas'}`;
    const html = `<div class="qrbox">${svg}</div><p>${info}</p>
      <p><a href="${blobUrl}" download="qr-${mode}-${tg}-${cur.id}.svg"><b>Descargar SVG</b></a><br><small>Enlace codificado: ${esc(url)}</small></p>`;
    qrLast = { id: cur.id, html }; out.innerHTML = html;
  } catch (e) { out.textContent = 'Error: ' + e.message; }
}

function readStyle(key, curStyle) {
  const s = normStyle(curStyle);
  document.querySelectorAll(`[data-sk="${key}"]`).forEach(inp => {
    const p = inp.dataset.sp;
    if (p === 'textColor' || p === 'bgColor' || p === 'textAlign') s[p] = inp.value;
    else s[p] = Number(inp.value);
  });
  return s;
}
function readMediaStyle(i, curMs) {
  const s = normMediaStyle(curMs);
  document.querySelectorAll(`[data-mk="${i}"]`).forEach(inp => {
    s[inp.dataset.mp] = Number(inp.value);
  });
  return s;
}
function sync() {
  if (!$('#f_name')) return;
  cur.name = $('#f_name').value;
  cur.elements.forEach((el, i) => {
    const ti = document.querySelector(`[data-ti="${i}"]`), tb = document.querySelector(`[data-tb="${i}"]`);
    if (ti && tb) { el.texts = el.texts || {}; el.texts[tab] = { title: ti.value, body: tb.value }; }
    if (el.type === 'text') el.style = readStyle(String(i), el.style);
    if (el.type === 'image') el.mediaStyle = readMediaStyle(i, el.mediaStyle);
    const dur = document.querySelector(`[data-dur="${i}"]`);
    if (dur) el.duration = Math.max(0, parseFloat(dur.value) || 0);
    (el.layers || []).forEach((l, j) => {
      const g = (a) => document.querySelector(`[data-${a}="${i}.${j}"]`);
      if (!g('ls')) return;
      l.start = Math.max(0, parseFloat(g('ls').value) || 0);
      l.duration = Math.max(0, parseFloat(g('ld').value) || 0);
      l.texts = l.texts || {};
      l.texts[tab] = { title: g('lt').value, body: g('lb').value };
      l.style = readStyle(`${i}.${j}`, l.style);
    });
  });
  syncPage();
}
async function save() {
  sync(); status('Guardando…');
  try {
    const opts = { headers:{'Content-Type':'application/json'}, body: JSON.stringify(cur) };
    const saved = cur.id ? await api('/api/experiences/' + cur.id, { method:'PUT', ...opts })
                         : await api('/api/experiences', { method:'POST', ...opts });
    await refresh(saved.id); status('✓ Guardado');
  } catch (e) { status('Error: ' + e.message); }
}
$('#btnNew').onclick = () => { view = 'exp'; cur = blank(); tab = 'es'; pv = 0; render(); };
refresh();
</script>
